<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Croppers | Premier Salon in Jabalpur, MP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Croppers is Jabalpur's premier modern salon offering precision haircuts, master beard grooming, and rejuvenating skin treatments. Book your 30-minute appointment online.">
  <meta name="theme-color" content="#fbfaf8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Single Page App Redirect Receiver for GitHub Pages -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
